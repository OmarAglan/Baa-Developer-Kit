name: Build Baa Developer Kit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Isolated Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out Developer Kit
        uses: actions/checkout@v4
        with:
          path: Baa-Developer-Kit

      - name: Check out Nazm
        uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 4e5997438933c38db70463f3f49dea96074982fd
          path: Nazm

      - name: Check out Baa
        uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa
          ref: e495411a6e65d2aff12b97c5ce80fa43d5f9b369
          path: Baa

      - name: Check out Takween
        uses: actions/checkout@v4
        with:
          repository: OmarAglan/Takween
          ref: fa0c4162495267f2679d543bfc55f600719bdd5f
          path: Takween

      - name: Check out Qalam
        uses: actions/checkout@v4
        with:
          repository: OmarAglan/Qalam-IDE
          ref: fe30d08a3d253d474d37c94e452daed5e83d0b54
          path: Qalam-IDE

      - name: Check out Baa-LSP
        uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa-LSP
          ref: 90c8007105f97eea9330159ed67aa3a4becbcbf3
          path: Baa-LSP

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Add Windows MinGW toolchain
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Nazm installer
        shell: pwsh
        run: ./Nazm/scripts/build_installer.ps1

      - name: Prepare Baa private linker
        shell: pwsh
        run: ./Baa/scripts/prepare_gcc_bundle.ps1

      - name: Build Baa installer
        shell: pwsh
        run: |
          ./Baa/scripts/build_installer.ps1 `
            -NazmExecutable "$env:GITHUB_WORKSPACE\Nazm\build\windows-release\nazm.exe"

      - name: Build Takween installer
        shell: pwsh
        run: |
          ./Takween/scripts/build_installer.ps1 `
            -BaaPath "$env:GITHUB_WORKSPACE\Baa\build\baa.exe" `
            -BaaStdlibPath "$env:GITHUB_WORKSPACE\Baa\stdlib" `
            -NazmPath "$env:GITHUB_WORKSPACE\Nazm\build\windows-release\nazm.exe"

      - name: Build Qalam and Baa-LSP
        shell: pwsh
        run: |
          ./Qalam-IDE/scripts/bootstrap-windows.ps1 `
            -SkipWinget `
            -BuildTests `
            -SkipCompiler `
            -BaaLspSourceDir "$env:GITHUB_WORKSPACE\Baa-LSP"

      - name: Build Qalam installer
        shell: pwsh
        run: |
          ./Qalam-IDE/scripts/build_installer.ps1 `
            -Version 3.7.0 `
            -BuildDir build/windows-release `
            -BaaLspExecutable "$env:GITHUB_WORKSPACE\Baa-LSP\build\windows-release\baa-lsp.exe" `
            -SkipBuild

      - name: Build offline Developer Kit
        shell: pwsh
        working-directory: Baa-Developer-Kit
        run: ./scripts/Build-DeveloperKitInstaller.ps1

      - name: Verify isolated install, repair, runtime, and uninstall
        shell: powershell
        working-directory: Baa-Developer-Kit
        run: ./scripts/Test-DeveloperKitInstaller.ps1

      - name: Verify default Program Files and machine PATH lifecycle
        shell: powershell
        working-directory: Baa-Developer-Kit
        run: ./scripts/Test-DeveloperKitAllUsers.ps1

      - name: Upload versioned installer set
        uses: actions/upload-artifact@v4
        with:
          name: baa-developer-kit-0.6.0-x64
          if-no-files-found: error
          path: |
            Nazm/dist/installer/nazm-setup-0.4.0-x64.exe
            Nazm/dist/installer/nazm-setup-0.4.0-x64.exe.sha256
            Baa/dist/installer/baa-setup-0.6.0-x64.exe
            Baa/dist/installer/baa-setup-0.6.0-x64.exe.sha256
            Takween/dist/installer/takween-setup-0.1.0-x64.exe
            Takween/dist/installer/takween-setup-0.1.0-x64.exe.sha256
            Qalam-IDE/dist/installer/qalam-setup-3.7.0-x64.exe
            Qalam-IDE/dist/installer/qalam-setup-3.7.0-x64.exe.sha256
            Baa-Developer-Kit/dist/eco-installer-manifest-v1.json
            Baa-Developer-Kit/dist/installer/baa-developer-kit-setup-0.6.0-x64.exe
            Baa-Developer-Kit/dist/installer/baa-developer-kit-setup-0.6.0-x64.exe.sha256
            Baa-Developer-Kit/dist/installer/baa-developer-kit-setup-0.6.0-x64.zip
            Baa-Developer-Kit/dist/installer/baa-developer-kit-setup-0.6.0-x64.zip.sha256
